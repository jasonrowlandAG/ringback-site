<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply · Ringback for Sydney plumbers</title>
  <meta name="description" content="Apply for a Ringback install. Owner-operator residential plumbers in Greater Sydney only.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://ringback.works/apply">
  <style>
    :root { --bg:#0c0b0a; --surface:#161412; --border:#2a2622; --text:#f5f0e8; --muted:#a89f94; --accent:#e8a54b; --danger:#e07a6a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.65; font-size:1.0625rem; }
    a { color:var(--accent); }
    .wrap { max-width:560px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }
    header { display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0 1.5rem; border-bottom:1px solid var(--border); margin-bottom:2rem; }
    .logo { font-weight:700; color:var(--text); text-decoration:none; }
    .logo span { color:var(--accent); }
    nav a { color:var(--muted); text-decoration:none; margin-left:1rem; font-size:0.9375rem; }
    h1 { font-size:1.75rem; line-height:1.2; margin:0 0 0.5rem; }
    .lead { color:var(--muted); margin:0 0 1.75rem; }
    label { display:block; font-size:0.875rem; font-weight:600; margin:0 0 0.35rem; }
    .field { margin-bottom:1.1rem; }
    input[type=text], input[type=email], input[type=tel], textarea {
      width:100%; padding:0.7rem 0.85rem; border-radius:8px; border:1px solid var(--border);
      background:var(--surface); color:var(--text); font:inherit;
    }
    textarea { min-height:88px; resize:vertical; }
    .yn { display:flex; gap:0.5rem; }
    .yn label { flex:1; display:flex; align-items:center; justify-content:center; gap:0.4rem; padding:0.65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); cursor:pointer; font-weight:500; }
    .yn input { accent-color:var(--accent); }
    button { width:100%; margin-top:0.5rem; padding:0.85rem 1.25rem; border:0; border-radius:8px; background:var(--accent); color:#1a1208; font-weight:700; font-size:1rem; cursor:pointer; }
    .note { color:var(--muted); font-size:0.875rem; margin-top:1rem; }
    .result { display:none; margin-top:1.5rem; padding:1.15rem 1.25rem; border-radius:10px; border:1px solid var(--border); background:var(--surface); }
    .result.show { display:block; }
    .result.ok { border-color:#3d6b4f; }
    .result.no { border-color:var(--danger); }
    .result h2 { margin:0 0 0.5rem; font-size:1.1rem; }
    .result p { margin:0 0 0.5rem; color:var(--muted); }
    .result ul { margin:0.5rem 0 0; padding-left:1.2rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="/">Ring<span>back</span></a>
      <nav><a href="/blog">Blog</a><a href="/apply">Apply</a></nav>
    </header>
    <h1>Apply for an install</h1>
    <p class="lead">This intake is narrow on purpose. If it is not a fit, the form will say so. We keep the no. It is how we remember why.</p>
    <form id="apply-form" novalidate>
      <div class="field"><label for="name">Your name</label><input id="name" name="name" type="text" required autocomplete="name"></div>
      <div class="field"><label for="business">Business name</label><input id="business" name="business" type="text" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="phone">Mobile</label><input id="phone" name="phone" type="tel" required autocomplete="tel"></div>
      <div class="field"><label for="suburb">Main suburb you work from</label><input id="suburb" name="suburb" type="text" required placeholder="e.g. Parramatta"></div>
      <div class="field"><label>Owner-operator (you are on the tools)?</label><div class="yn"><label><input type="radio" name="owner" value="yes" required> Yes</label><label><input type="radio" name="owner" value="no"> No</label></div></div>
      <div class="field"><label>Residential plumbing is the main work?</label><div class="yn"><label><input type="radio" name="plumbing" value="yes" required> Yes</label><label><input type="radio" name="plumbing" value="no"> No</label></div></div>
      <div class="field"><label>Greater Sydney service area?</label><div class="yn"><label><input type="radio" name="sydney" value="yes" required> Yes</label><label><input type="radio" name="sydney" value="no"> No</label></div></div>
      <div class="field"><label>You answer the inbound mobile yourself (no receptionist)?</label><div class="yn"><label><input type="radio" name="mobile" value="yes" required> Yes</label><label><input type="radio" name="mobile" value="no"> No</label></div></div>
      <div class="field"><label for="notes">Anything else (optional)</label><textarea id="notes" name="notes" placeholder="e.g. after-hours load, how many vans"></textarea></div>
      <button type="submit">Check fit</button>
      <p class="note">No spam list. We only use this to reply about an install.</p>
    </form>
    <div id="result" class="result" role="status"></div>
  </div>
  <script>
    const form = document.getElementById('apply-form');
    const result = document.getElementById('result');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const reasons = [];
      if (data.get('owner') !== 'yes') reasons.push('This intake is for owner-operators on the tools.');
      if (data.get('plumbing') !== 'yes') reasons.push('Adjacent trade. Not this intake. Plumbers first.');
      if (data.get('sydney') !== 'yes') reasons.push('Greater Sydney only for this intake.');
      if (data.get('mobile') !== 'yes') reasons.push('This install sits on the mobile you already answer, not a desk receptionist setup.');
      result.className = 'result show ' + (reasons.length ? 'no' : 'ok');
      if (reasons.length) {
        result.innerHTML = '<h2>Not this intake</h2><p>Thanks for the honesty. Right now we are not a fit because:</p><ul>' +
          reasons.map(r => '<li>' + r + '</li>').join('') +
          '</ul><p>If that changes, you can apply again later.</p>';
      } else {
        const name = data.get('name');
        const business = data.get('business');
        const email = data.get('email');
        const phone = data.get('phone');
        const suburb = data.get('suburb');
        const notes = data.get('notes') || '';
        const subject = encodeURIComponent('Ringback install application — ' + business);
        const body = encodeURIComponent(
          'Name: ' + name + '\nBusiness: ' + business + '\nEmail: ' + email +
          '\nMobile: ' + phone + '\nSuburb: ' + suburb +
          '\nOwner-operator: yes\nResidential plumbing: yes\nGreater Sydney: yes\nAnswers own mobile: yes\n\nNotes:\n' + notes
        );
        result.innerHTML = '<h2>You fit this intake</h2>' +
          '<p>Send the application and we will reply about the next step for a named install.</p>' +
          '<p><a href="mailto:hello@ringback.works?subject=' + subject + '&body=' + body +
          '" style="color:#e8a54b;font-weight:600">Email application to hello@ringback.works</a></p>' +
          '<p style="margin-top:0.75rem;font-size:0.9rem">If that address is not live yet, email from the address you used above and reference Ringback.</p>';
      }
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  </script>
</body>
</html>
